# One-click deploy config. `--workers 1` is deliberate: uploads write files that the next
# request reads, so a second worker with its own view of the filesystem would serve a
# half-loaded queue. `--timeout 120` because reading a reference workbook takes seconds.
services:
  - type: web
    name: ylookup-review
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn 'src.ui.app:app' --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
